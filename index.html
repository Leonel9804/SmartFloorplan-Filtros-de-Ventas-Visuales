<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StoreMap Analytics</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>StoreMap Analytics</h1>

    </header>

    <main>

        <aside>

            Panel de filtros

        </aside>

        <section>
            <!--Las lineas id,width,heigth y viewbox nos da el tamaño del plano-->
            <SVG
                id="plano"  
                width="900" 
                height="600"
                viewBox="0 0 900 600">   
                <!--Un texto para indicar la entrada-->
                <text 
                x="370"
                y="40"
                font-size="24"
                fill="Black">
                ENTRADA
                </text>
                <!--Aparece aqui mi cuadro simulando el mueble
                Stroke nos da el color del borde y stroke-width nos da el grosor del borde
                Se agrega class para agrupar una elementos llamados muebles-->
                <!--Rect dibuja un rectangulo-->
                <rect 
                id="M01"
                class="mueble"
                x="100"
                y="80"
                width="100"
                height="50"
                fill="#BDBDBD"
                stroke="#424242" 
                stroke-width="2"/>

            </SVG>
        </section>

    </main>

    <footer>
        <div id="info">
        Información del mueble
        </div>
    </footer>

<script src="data/muebles.js"></script>
<script src="js/app.js"></script>

</body>

</html>
