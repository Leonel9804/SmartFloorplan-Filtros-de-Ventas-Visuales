<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StoreMap Analytics</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>Moda Tela</h1>

    </header>

    <main>

        <aside>

            Panel de filtros

            <h3>Filtros</h3>

            <button id="btnMasVendidos">
                🏆 Más vendidos
            </button>

            <br><br>

            <button id="btnMenosVendidos">
                📉 Menos vendidos
            </button>

            <br><br>

            <button id="btnStock">
                📦 Bajo stock
            </button>

            <br><br>

            <button id="btnReset">
                🔄 Reiniciar
            </button>

        </aside>

        <section>
            <!--Las lineas id,width,heigth y viewbox nos da el tamaño del plano-->
            <SVG id="plano" width="900" height="600" viewBox="0 0 900 600" fill="#FAFAFA">
                <!--Un texto para indicar la entrada-->
                <text x="400" y="35" font-size="16" fill="middle">🚪</text>
                <text x="400" y="60" font-sixe="24" font-weight="bold" text-anchor="middle"
                    fill="#2E7D32">ENTRADA</text>
                <!--Aparece aqui mi cuadro simulando el mueble
                Stroke nos da el color del borde y stroke-width nos da el grosor del borde
                Se agrega class para agrupar una elementos llamados muebles-->
                <!--Rect dibuja un rectangulo-->
                <!--Aqui se dibuja un pasillo principal vertical y horizontal-->
                <rect x="420" y="70" width="60" height="420" fill="#ECEFF1" />
                <rect x="70" y="290" width="700" height="50" fill="#ECEFF1" />
                <!--Creacion de las cajas-->
                <rect x="340" y="520" width="180" height="45" rx="8" fill="#FFD54F" stroke="#555" stroke-width="2" />

                <text x="430" y="548" text-anchor="middle" font-size="18" font-weight="bold">

                    🛒 CAJAS

                </text>
            </SVG>
        </section>

    </main>

    <footer>
        <div id="info">
            Información del mueble
        </div>
    </footer>

    <script src="data/muebles.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
